# all 
---
- name: Install Keepalived 
  apt: 
    name: keepalived
    state: present # absent for remove 
- name: Generate configuration for keeaplived 
  template: 
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf

- name: Start and enable keepalived 
  service: 
    name: keepalived
    enabled: yes 
    state: started 

