---
- name: APT Update 
  apt: 
    update_cache : true 
# Shift + Tab = UnIndent 
- name: Install NFS Server Kernel
  apt: 
    name: nfs-kernel-server 
    state: present 
- name: Create Shared Directory 
  file: 
    path: "{{ nfs_export_dir }}"
    state: directory 
    owner: nobody 
    group: nogroup 
    mode: "0777"

- name: Write Exports Config 
  lineinfile: 
    path: /etc/exports 
    line: "{{ nfs_export_dir}}  {{nfs_client_ip }}(rw,sync,no_subtree_check,no_root_squash)"
    create: yes
    state: present 
- name: Apply configuration 
  command: exportfs -ra
- name: Restart nfs-server service 
  systemd: 
    name: nfs-kernel-server
    enabled: true 
    state: restarted 